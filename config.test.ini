[database_source]
host = localhost
port = 3306
username = root
password = testpass
database = site_a_test
driver = mysql

[database_target]
host = localhost
port = 3307
username = root
password = testpass
database = site_b_test
driver = mysql

[replication]
table_name = sim_imei_binding
interval_seconds = 5
site_identifier = sa-east-1a
source_az = sa-east-1a
target_az = sa-east-1c
enable_logging = true
batch_size = 10

[server]
port = 8081
host = 0.0.0.0

[metrics]
enable_prometheus = true
metrics_path = /metrics
